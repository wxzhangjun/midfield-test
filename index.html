<!--
中场扛事者·1分钟状态快测
部署方式：GitHub Pages，获取公开链接后微信私发。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>中场扛事者 · 1分钟状态快测</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: #f9f8f6;
  color: #2c2c2c;
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  padding-bottom: 80px;
}

.container {
  width: 100%;
  max-width: 500px;
  padding: 24px 20px 60px;
}

/* 进度区 */
.progress-area {
  margin-bottom: 32px;
}
.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}
.progress-label {
  font-size: 16px;
  color: #999;
  letter-spacing: 0.5px;
}
.progress-bar-track {
  width: 100%;
  height: 3px;
  background: #e8e6e0;
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: #2c2c2c;
  border-radius: 2px;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 题目区 */
.question-block {
  display: none;
  animation: fadeSlideIn 0.35s ease;
}
.question-block.active {
  display: block;
}
.question-text {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 28px;
  color: #1a1a1a;
}
.options-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-btn {
  display: block;
  width: 100%;
  min-height: 54px;
  padding: 14px 18px;
  background: #fff;
  border: 1px solid #e0ddd6;
  border-radius: 10px;
  font-size: 16px;
  line-height: 1.55;
  text-align: left;
  color: #2c2c2c;
  cursor: pointer;
  -webkit-appearance: none;
  transition: background 0.15s, border-color 0.15s;
  font-family: inherit;
}
.option-btn:active {
  background: #f0ede7;
  border-color: #ccc;
}
.option-letter {
  display: inline-block;
  min-width: 22px;
  font-weight: 600;
  color: #999;
  margin-right: 4px;
}

/* 动画 */
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container" id="app">

  <!-- 进度 -->
  <div class="progress-area" id="progressArea">
    <div class="progress-header">
      <span class="progress-label" id="progressLabel">第 1 / 5</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill" style="width: 20%;"></div>
    </div>
  </div>

  <!-- 题目渲染区 -->
  <div id="questionsContainer"></div>

</div>

<script>
(function() {
  var questions = [
    {
      q: '过去一周，你早上醒来的第一反应通常是？',
      options: [
        { letter: 'A', text: '知道今天要干什么，按计划来' },
        { letter: 'B', text: '脑子里先过一遍待办，有点多但还行' },
        { letter: 'C', text: '想到今天要面对的事，有点烦躁' },
        { letter: 'D', text: '不太想起来，或者起来了也不知道该干嘛' }
      ]
    },
    {
      q: '过去一个月，你主动做出的"为自己"的决定有几个？',
      options: [
        { letter: 'A', text: '3个以上（比如换了晨跑路线、报了个课、拒绝了一次无效社交）' },
        { letter: 'B', text: '1-2个（想做点什么，但大部分时间还是在应付）' },
        { letter: 'C', text: '0个，但心里一直在想"该为自己做点什么了"' },
        { letter: 'D', text: '没想过这个问题，或者想不起来' }
      ]
    },
    {
      q: '过去三个月，你因为"年龄/体力/代际差异"产生过焦虑吗？',
      options: [
        { letter: 'A', text: '几乎没有，我觉得经验是优势' },
        { letter: 'B', text: '偶尔有，但还在可控范围' },
        { letter: 'C', text: '经常有，尤其看到年轻人/AI的时候' },
        { letter: 'D', text: '持续焦虑，但说不清楚到底在怕什么' }
      ]
    },
    {
      q: '过去半年，你做过"完全为自己"的决定吗？',
      options: [
        { letter: 'A', text: '有，而且正在做' },
        { letter: 'B', text: '想过，但觉得时机不对' },
        { letter: 'C', text: '发现大部分时间都在满足别人的期待' },
        { letter: 'D', text: '想不起上次为自己做选择是什么时候了' }
      ]
    },
    {
      q: '如果只能解决一个问题，你会先解决？',
      options: [
        { letter: 'A', text: '时间不够/效率低（总觉得忙不完）' },
        { letter: 'B', text: '方向不清（知道要变，但不知道往哪走）' },
        { letter: 'C', text: '精力透支（心里那股说不出的累）' },
        { letter: 'D', text: '资源不足（钱/人脉/机会不够）' }
      ]
    }
  ];

  var answers = [];
  var currentIndex = 0;
  var questionsContainer = document.getElementById('questionsContainer');
  var progressArea = document.getElementById('progressArea');
  var progressLabel = document.getElementById('progressLabel');
  var progressFill = document.getElementById('progressFill');

  function renderQuestions() {
    var html = '';
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      html += '<div class="question-block" data-index="' + i + '">';
      html += '<p class="question-text">' + q.q + '</p>';
      html += '<div class="options-list">';
      for (var j = 0; j < q.options.length; j++) {
        var opt = q.options[j];
        html += '<button class="option-btn" data-index="' + i + '" data-letter="' + opt.letter + '">';
        html += '<span class="option-letter">' + opt.letter + '.</span>' + opt.text;
        html += '</button>';
      }
      html += '</div></div>';
    }
    questionsContainer.innerHTML = html;
  }

  function showQuestion(index) {
    var allBlocks = questionsContainer.querySelectorAll('.question-block');
    for (var i = 0; i < allBlocks.length; i++) {
      allBlocks[i].classList.remove('active');
    }
    var target = questionsContainer.querySelector('[data-index="' + index + '"]');
    if (target) target.classList.add('active');

    var num = index + 1;
    progressLabel.textContent = '第 ' + num + ' / 5';
    progressFill.style.width = (num / 5 * 100) + '%';
  }

  // 计分逻辑：严格按你的判定规则
  function determineResult() {
    var counts = { A: 0, B: 0, C: 0, D: 0 };
    for (var i = 0; i < answers.length; i++) {
      counts[answers[i]]++;
    }

    // 卡点型优先判定：D≥2 或 B+D≥4
    if (counts['D'] >= 2 || (counts['B'] + counts['D'] >= 4)) {
      return 'D';
    }
    // 领航型：A≥3
    if (counts['A'] >= 3) {
      return 'A';
    }
    // 负重型：C≥3
    if (counts['C'] >= 3) {
      return 'C';
    }
    // 维持型：B≥3
    if (counts['B'] >= 3) {
      return 'B';
    }
    // 边缘情况：默认维持型
    return 'B';
  }

  // 答完跳转结果页
  function goToResult() {
    var typeLetter = determineResult();
    window.location.href = 'result.html?type=' + typeLetter;
  }

  function findOptionBtn(el) {
    while (el && el !== questionsContainer) {
      if (el.classList && el.classList.contains('option-btn')) return el;
      el = el.parentNode;
    }
    return null;
  }

  questionsContainer.addEventListener('click', function(e) {
    var btn = findOptionBtn(e.target);
    if (!btn) return;

    var index = parseInt(btn.getAttribute('data-index'), 10);
    var letter = btn.getAttribute('data-letter');
    if (index !== currentIndex) return;

    answers[index] = letter;
    currentIndex++;

    if (currentIndex >= questions.length) {
      goToResult();
    } else {
      showQuestion(currentIndex);
    }
  });

  renderQuestions();
  showQuestion(0);
})();
</script>
</body>
</html>
